name: Build from Zip

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unzip + Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip ThugLife source
        run: |
          ZIP_FILE="ThugLife-source.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ فایل $ZIP_FILE پیدا نشد!"
            ls -la
            exit 1
          fi
          unzip -q "$ZIP_FILE"
          if [ -d "ThugLife" ]; then
            echo "✅ زیپ باز شد"
          else
            echo "❌ پوشه ThugLife پیدا نشد"
            exit 1
          fi

      # --- رفع باگ کامنت در AudioController.kt ---
      - name: Fix unclosed comment
        run: |
          FILE="ThugLife/app/src/main/java/com/thuglife/app/audio/AudioController.kt"
          # تغییر audio/* به audio/... تا کامنت خراب نشه
          sed -i 's|assets/audio/\*|assets/audio/...|g' "$FILE"
          echo "✅ کامنت درست شد"
          grep -n "audio" "$FILE" | head -5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ThugLife
        run: gradle --no-daemon :app:assembleDebug

      - name: Check APK exists
        working-directory: ThugLife
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thug-life-debug-apk
          path: ThugLife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
