
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Extract, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          shopt -s nullglob
          zips=( "$GITHUB_WORKSPACE"/*.zip )

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::Multiple ZIP files found. Keep only one source ZIP in the repository root."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi

          echo "zip_path=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Found source ZIP: $(basename "${zips[0]}")"

      - name: Extract Android project
        id: extract
        shell: bash
        run: |
          EXTRACT_DIR="$RUNNER_TEMP/android-source"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "${{ steps.source.outputs.zip_path }}" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(find "$EXTRACT_DIR" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts in the ZIP."
            find "$EXTRACT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Could not find app/build.gradle or app/build.gradle.kts."
            echo "Detected project directory: $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --licenses </dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate project content
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/tools/validate_content.py" ]; then
            python3 "$PROJECT_DIR/tools/validate_content.py"
          elif [ -f "$PROJECT_DIR/validate_content.py" ]; then
            python3 "$PROJECT_DIR/validate_content.py"
          else
            echo "No content validation script found; skipping."
          fi

      - name: Run unit tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        id: apk
        shell: bash
        run: |
          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated at the expected path."
            echo "Searching for APK files..."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThugLife-debug-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThugLife-test-reports
          path: |
            ${{ steps.extract.outputs.project_dir }}/app/build/reports/tests/
            ${{ steps.extract.outputs.project_dir }}/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
