# .github/workflows/android-build.yml
name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------- 1) checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------- 2) باز کردن زیپ پروژه ----------
      - name: Extract project zip (if present)
        shell: bash
        run: |
          set -euo pipefail

          # زیپ را در کل مخزن (به جز .git) پیدا کن
          ZIP="$(find . -path ./.git -prune -o -iname '*.zip' -type f -print | head -n 1 || true)"
          if [ -z "${ZIP:-}" ]; then
            echo "::notice::هیچ فایل zip پیدا نشد؛ فرض می‌کنیم سورس‌ها از قبل در ریشه هستند."
            ls -la
            exit 0
          fi

          echo "Found archive: $ZIP"
          rm -rf _extracted
          mkdir -p _extracted
          unzip -q "$ZIP" -d _extracted

          # پوشه‌ای که settings.gradle(.kts) دارد = ریشه پروژه واقعی
          SETTINGS="$(find _extracted -maxdepth 4 \
                        \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
                        -print | head -n 1 || true)"
          if [ -z "${SETTINGS:-}" ]; then
            echo "::error::داخل زیپ هیچ settings.gradle(.kts) پیدا نشد."
            find _extracted -maxdepth 3 -print
            exit 1
          fi

          PROJ_DIR="$(dirname "$SETTINGS")"
          echo "Project root inside zip: $PROJ_DIR"

          # --- انتقال محتوای زیپ به ریشه‌ی workspace ---
          # .github عمداً exclude می‌شود تا workflow در حال اجرا از بین نرود
          rsync -a --exclude='.github' "$PROJ_DIR"/ ./

          # اگر داخل زیپ هم .github بود، فقط فایل‌های جدیدش را اضافه کن (no-clobber)
          if [ -d "$PROJ_DIR/.github" ]; then
            mkdir -p .github
            cp -rn "$PROJ_DIR/.github/." ./.github/ 2>/dev/null || true
          fi

          rm -rf _extracted
          rm -f "$ZIP"

          echo "Workspace after extraction:"
          ls -la

      # ---------- 3) چک سریع ساختار ----------
      - name: Verify project files
        run: |
          set -e
          test -f settings.gradle.kts || test -f settings.gradle \
            || { echo "::error::settings.gradle(.kts) موجود نیست"; exit 1; }
          test -f app/build.gradle.kts  || test -f app/build.gradle \
            || { echo "::error::app/build.gradle(.kts) موجود نیست"; exit 1; }
          echo "OK: ساختار پروژه پیدا شد."

      # ---------- 4) JDK 17 ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 5) Android SDK ----------
      # نکته: در android-actions/setup-android@v3 پکیج 'tools' دیگر در مخزن گوگل نیست؛
      # پس با packages: '' هیچ پکیج اضافه‌ای درخواست نمی‌شود.
      # AGP هنگام بیلد خودش platform و build-tools را دانلود می‌کند.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ---------- 6) Gradle 8.9 (با کش داخلی) ----------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Make gradlew executable
        run: |
          [ -f ./gradlew ] && chmod +x ./gradlew || true

      # ---------- 7) بیلد دیباگ ----------
      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle    :app:assembleDebug --no-daemon --stacktrace
          fi

      # ---------- 8) اگر Secrets امضا تنظیم شده بود، نسخه‌ی release هم بساز ----------
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.THUGLIFE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          THUGLIFE_KEYSTORE_FILE:     ${{ github.workspace }}/release.keystore
          THUGLIFE_KEYSTORE_PASSWORD: ${{ secrets.THUGLIFE_KEYSTORE_PASSWORD }}
          THUGLIFE_KEY_ALIAS:         ${{ secrets.THUGLIFE_KEY_ALIAS }}
          THUGLIFE_KEY_PASSWORD:      ${{ secrets.THUGLIFE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.THUGLIFE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle    :app:assembleRelease --no-daemon --stacktrace
          fi
          rm -f release.keystore

      # ---------- 9) آپلود artifactها ----------
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thuglife-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thuglife-release-apk
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
