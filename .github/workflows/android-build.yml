- name: Extract project zip (if present)
  shell: bash
  run: |
    set -euo pipefail

    ZIP="$(find . -path ./.git -prune -o -iname '*.zip' -type f -print | head -n 1 || true)"
    if [ -z "${ZIP:-}" ]; then
      echo "::notice::هیچ فایل zip پیدا نشد؛ فرض می‌کنیم سورس‌ها از قبل در ریشه هستند."
      ls -la
      exit 0
    fi

    echo "Found archive: $ZIP"
    rm -rf _extracted
    mkdir -p _extracted
    unzip -q "$ZIP" -d _extracted

    SETTINGS="$(find _extracted -maxdepth 4 \
                  \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
                  -print | head -n 1 || true)"
    if [ -z "${SETTINGS:-}" ]; then
      echo "::error::داخل زیپ هیچ settings.gradle(.kts) پیدا نشد."
      find _extracted -maxdepth 3 -print
      exit 1
    fi

    PROJ_DIR="$(dirname "$SETTINGS")"
    echo "Project root inside zip: $PROJ_DIR"

    # --- انتقال محتوای زیپ به ریشه‌ی workspace ---
    # .github عمداً exclude می‌شود تا workflow در حال اجرا از بین نرود
    rsync -a --exclude='.github' "$PROJ_DIR"/ ./

    # اگر داخل زیپ هم .github بود، فقط فایل‌های جدیدش را اضافه کن (no-clobber)
    if [ -d "$PROJ_DIR/.github" ]; then
      mkdir -p .github
      cp -rn "$PROJ_DIR/.github/." ./.github/ 2>/dev/null || true
    fi

    rm -rf _extracted
    rm -f "$ZIP"

    echo "Workspace after extraction:"
    ls -la
