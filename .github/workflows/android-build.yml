
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-zip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract, Test and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 -type f -iname "*.zip"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No source ZIP found in repository root."
            echo "Upload ThugLife-source.zip to the root of the repository."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: Multiple ZIP files found. Keep only one source ZIP in the repository root."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/android-source"

          unzip -q "${{ steps.source.outputs.zip }}" \
            -d "$RUNNER_TEMP/android-source"

          PROJECT_DIR=""

          while IFS= read -r -d '' SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [ -f "$CANDIDATE/app/build.gradle.kts" ] ||
               [ -f "$CANDIDATE/app/build.gradle" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$RUNNER_TEMP/android-source" \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.gradle/*' \
              -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            echo "Expected settings.gradle(.kts) and app/build.gradle(.kts)."
            find "$RUNNER_TEMP/android-source" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate bundled content
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f tools/validate_content.py ]; then
            python3 --version
            python3 tools/validate_content.py
          else
            echo "No content validator found; skipping this optional check."
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK missing or empty."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThugLife-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThugLife-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
          
